plugins {
    id 'com.android.application'
}

android {
    namespace 'com.k2.launchcheck'
    compileSdk 34

    defaultConfig {
        applicationId 'com.k2.launchcheck'
        minSdk 19
        targetSdk 22
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
